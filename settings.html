<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الحساب | سوق.كوم</title>
    <script src="common.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{head:['Cairo','Tajawal','sans-serif'],body:['Tajawal','Cairo','sans-serif']}}}};</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);}
        .input-style {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            padding: 0.75rem 1rem;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-style:focus {
            border-color: #2563eb;
            background: #fff;
        }
        .primary-btn {
            background: linear-gradient(90deg,#2563eb 70%, #fbeed3 100%);
            color: white;
            font-weight: 500;
        }
        .primary-btn:hover {
            background: linear-gradient(90deg,#1e40af 70%, #fbeed3 100%);
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.95rem;
        }
        .success-msg {
            color: #16a34a;
            font-size: 1.1rem;
            text-align: center;
        }
        .settings-row { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            margin-bottom: 2.5rem; 
        }
        .settings-label {
            min-width: 110px;
            color: #2563eb;
            font-weight: 700;
            font-size: 1.12rem;
        }
        .settings-value {
            font-weight: 500;
            color: #22223b;
            font-size: 1.07rem;
            direction: ltr;
            letter-spacing: 0.01em;
        }
        .modal-bg { background: rgba(0,0,0,0.4);}
        .modal-sheet {
            background: #fff;
            border-radius: 1.2rem;
            max-width: 380px;
            width: 96%;
            margin: 0 auto;
            padding: 2.5rem 2rem 2rem 2rem;
            box-shadow: 0 4px 32px 0 #0002;
            position: relative;
        }
        .modal-sheet input {margin-bottom: 1.2rem;}
        .icon-btn {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0 6px;
            color: #2563eb;
            font-size: 1.1rem;
            transition: color 0.15s;
        }
        .icon-btn:hover { color: #1e40af; }
        .home-btn {
            position: absolute;
            top: 26px;
            right: 32px;
            z-index: 50;
            background: #f8fafc;
            border-radius: 999px;
            box-shadow: 0 2px 6px #2563eb22;
            padding: 0.65rem 0.86rem;
            color: #2563eb;
            font-size: 1.5rem;
            border: 2px solid #e0e7ff;
            transition: background 0.18s, color 0.18s;
        }
        .home-btn:hover {
            background: #2563eb;
            color: #fff;
        }
        @media (max-width: 600px) {
            .home-btn { right: 12px; top: 14px; font-size: 1.2rem; padding: 0.5rem 0.7rem;}
        }
    </style>

  <meta name="description" content="سوق.كوم — متجر ليبي للشنط والإكسسوارات الأصلية.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="سوق.كوم">
  <meta property="og:description" content="شنط وإكسسوارات أصلية — توصيل لكل ليبيا.">
  <meta property="og:image" content="assets/og-cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="site.css">

</head>
<body class="rtl-support font-body">
<div id="site-header"></div>
    

    <main id="main" class="container mx-auto px-4 py-8 max-w-xl">
        <div class="bg-white rounded-2xl shadow-xl p-8 pt-4 relative">
            <div class="flex flex-col items-center mb-8">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Default_pfp.svg/2048px-Default_pfp.svg.png" alt="صورة المستخدم" class="w-24 h-24 rounded-full border-4 border-blue-200 shadow mb-1">
            </div>
            <div id="settingsContent" class="space-y-8">
                <div class="settings-row">
                    <span class="settings-label"><i class="fa fa-user mr-1"></i> الاسم</span>
                    <span class="settings-value" id="userFullName">...</span>
                    <button id="btnEditName" class="primary-btn px-4 py-2 rounded-lg text-sm"><i class="fa fa-edit"></i> تغيير</button>
                </div>
                <div class="settings-row">
                    <span class="settings-label"><i class="fa fa-envelope mr-1"></i> البريد</span>
                    <span class="settings-value" id="userEmail">...</span>
                </div>
                <div class="settings-row">
                    <span class="settings-label"><i class="fa fa-lock mr-1"></i> كلمة المرور</span>
                    <span class="settings-value" id="passwordStars">
                        <span id="starsText">********</span>
                       
                    </span>
                    <button id="btnEditPass" class="primary-btn px-4 py-2 rounded-lg text-sm"><i class="fa fa-key"></i> تغيير</button>
                </div>
            </div>
        </div>
    </main>

    <!-- مودال تغيير الاسم -->
    <div id="modalEditNameBg" class="fixed inset-0 z-50 flex items-center justify-center modal-bg hidden">
        <div class="modal-sheet">
            <button onclick="closeModal('modalEditNameBg')" class="absolute left-4 top-4 text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold text-blue-700 mb-6 text-center">تغيير الاسم</h2>
            <form id="formEditName">
                <input type="text" id="inputNewName" class="input-style w-full mb-2" required minlength="3" placeholder="الاسم الجديد">
                <div class="error-msg" id="nameEditError"></div>
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg w-full">حفظ</button>
                <div class="success-msg hidden" id="nameEditSuccess">تم تحديث الاسم بنجاح!</div>
            </form>
        </div>
    </div>

    <!-- مودال تغيير كلمة المرور -->
    <div id="modalEditPassBg" class="fixed inset-0 z-50 flex items-center justify-center modal-bg hidden">
        <div class="modal-sheet">
            <button onclick="closeModal('modalEditPassBg')" class="absolute left-4 top-4 text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold text-blue-700 mb-6 text-center">تغيير كلمة المرور</h2>
            <form id="formEditPass">
                <div class="relative">
                    <input type="password" id="currentPass" class="input-style w-full pr-12" placeholder="كلمة المرور الحالية" autocomplete="current-password" required>
                    <button type="button" class="icon-btn absolute left-2 top-1/2 -translate-y-1/2" onclick="toggleFieldPassword('currentPass', this)"><i class="fa fa-eye"></i></button>
                </div>
                <div class="relative">
                    <input type="password" id="newPass" class="input-style w-full pr-12" placeholder="كلمة المرور الجديدة" minlength="8" autocomplete="new-password" required>
                    <button type="button" class="icon-btn absolute left-2 top-1/2 -translate-y-1/2" onclick="toggleFieldPassword('newPass', this)"><i class="fa fa-eye"></i></button>
                </div>
                <div class="relative">
                    <input type="password" id="confirmNewPass" class="input-style w-full pr-12" placeholder="تأكيد كلمة المرور الجديدة" minlength="8" autocomplete="new-password" required>
                    <button type="button" class="icon-btn absolute left-2 top-1/2 -translate-y-1/2" onclick="toggleFieldPassword('confirmNewPass', this)"><i class="fa fa-eye"></i></button>
                </div>
                <div class="error-msg" id="passEditError"></div>
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg w-full">تغيير</button>
                <div class="success-msg hidden" id="passEditSuccess">تم تغيير كلمة المرور بنجاح!</div>
            </form>
        </div>
    </div>

<script>
let userProfile = null;

// جلب بيانات المستخدم
async function fetchProfile() {
    try {
        const res = await apiFetch('/api/profile');
        userProfile = res.apiBody || {};
        document.getElementById('userFullName').textContent = userProfile.fullName || "";
        document.getElementById('userEmail').textContent = userProfile.email || "";
    } catch (err) {
        if (err && err.status === 401) {
            window.location.href = "signup.html";
            return;
        }
        document.getElementById('settingsContent').innerHTML =
            '<div class="text-center text-red-500 text-lg my-10">تعذر جلب البيانات! <button onclick="fetchProfile()" class="underline text-blue-600">إعادة المحاولة</button></div>';
    }
}
fetchProfile();

// فتح وغلق المودال
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// زر تغيير الاسم
document.getElementById('btnEditName').onclick = function() {
    document.getElementById('inputNewName').value = userProfile?.fullName || "";
    document.getElementById('nameEditError').textContent = "";
    document.getElementById('nameEditSuccess').classList.add('hidden');
    openModal('modalEditNameBg');
};
// حفظ الاسم الجديد
document.getElementById('formEditName').onsubmit = async function(e) {
    e.preventDefault();
    const fullName = document.getElementById('inputNewName').value.trim();
    if (fullName.length < 3) {
        document.getElementById('nameEditError').textContent = "يرجى إدخال اسم صحيح";
        return;
    }
    document.getElementById('nameEditError').textContent = "";
    try {
        const res = await apiFetch("/api/settings/profile", {
            method: "POST",
            body: JSON.stringify({ fullName })
        });
        const data = res.apiBody || {};
        document.getElementById('nameEditSuccess').classList.remove('hidden');
        if (userProfile) userProfile.fullName = fullName;
        document.getElementById('userFullName').textContent = fullName;
        setTimeout(()=>closeModal('modalEditNameBg'), 1200);
    } catch (err) {
        document.getElementById('nameEditError').textContent = apiErrorMessage(err, "حدث خطأ");
    }
};

// زر تغيير كلمة المرور
document.getElementById('btnEditPass').onclick = function() {
    document.getElementById('formEditPass').reset();
    document.getElementById('passEditError').textContent = "";
    document.getElementById('passEditSuccess').classList.add('hidden');
    closePassView();
    openModal('modalEditPassBg');
};
// حفظ كلمة المرور الجديدة
document.getElementById('formEditPass').onsubmit = async function(e) {
    e.preventDefault();
    const currentPassword = document.getElementById('currentPass').value;
    const newPassword = document.getElementById('newPass').value;
    const confirmNewPassword = document.getElementById('confirmNewPass').value;
    if (!currentPassword || !newPassword || !confirmNewPassword) {
        document.getElementById('passEditError').textContent = "يرجى تعبئة جميع الحقول";
        return;
    }
    if (newPassword.length < 8 || !(/[A-Za-z]/.test(newPassword) && /[0-9]/.test(newPassword))) {
        document.getElementById('passEditError').textContent = "كلمة المرور يجب أن لا تقل عن 8 خانات وتحتوي على أحرف وأرقام";
        return;
    }
    if (newPassword !== confirmNewPassword) {
        document.getElementById('passEditError').textContent = "تأكيد كلمة المرور غير مطابق";
        return;
    }
    document.getElementById('passEditError').textContent = "";
    try {
        const res = await apiFetch("/api/settings/password", {
            method: "POST",
            body: JSON.stringify({ currentPassword, newPassword })
        });
        document.getElementById('passEditSuccess').classList.remove('hidden');
        document.getElementById('formEditPass').reset();
        closePassView();
        setTimeout(()=>closeModal('modalEditPassBg'), 1200);
    } catch (err) {
        document.getElementById('passEditError').textContent = apiErrorMessage(err, "حدث خطأ");
    }
};

// زر إظهار/إخفاء حقول المودال (لا نعرض كلمة المرور المخزنة أبداً)
function toggleFieldPassword(fieldId, btn) {
    const input = document.getElementById(fieldId);
    if (!input) return;
    if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = '<i class="fa fa-eye-slash"></i>';
    } else {
        input.type = "password";
        btn.innerHTML = '<i class="fa fa-eye"></i>';
    }
}
function closePassView() {
    // إجبار جميع الحقول على الوضع المخفي
    ["currentPass","newPass","confirmNewPass"].forEach(id=>{
        const field = document.getElementById(id);
        if(field) field.type="password";
        const btn = field?.parentElement?.querySelector('button.icon-btn');
        if(btn) btn.innerHTML='<i class="fa fa-eye"></i>';
    });
}

</script>
<div id="site-footer"></div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
