<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا — سوق.كوم</title>
  <meta name="description" content="تواصل مع فريق سوق.كوم — نرد على استفساراتك بسرعة عبر البريد أو الهاتف.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="تواصل معنا — سوق.كوم">
  <meta property="og:description" content="راسلنا في أي وقت وسنرد عليك بسرعة.">
  <meta property="og:image" content="assets/og-cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{head:['Cairo','Tajawal','sans-serif'],body:['Tajawal','Cairo','sans-serif']}}}};</script>
  <link rel="stylesheet" href="site.css">
  <script src="common.js"></script>
  <script src="account.js"></script>
  <script src="cart.js"></script>
</head>
<body class="rtl-support font-body">
<div id="site-header"></div>
<main id="main" class="container px-4 mt-6">
  <section class="bg-white/85 backdrop-blur rounded-3xl shadow-xl p-6 md:p-10" data-aos="fade-up">
    <p class="text-blue-600 font-bold text-sm mb-1">نسمعك دائماً</p>
    <h1 class="font-head text-2xl md:text-4xl font-extrabold mb-8 text-center">تواصل معنا</h1>
    <div class="max-w-2xl mx-auto">
      <form class="space-y-4" id="contactForm">
        <div><label class="block mb-1.5 font-bold text-slate-700" for="name">الاسم الكامل</label><input type="text" id="name" name="name" class="input-style" placeholder="اكتب اسمك هنا" required autocomplete="name"></div>
        <div><label class="block mb-1.5 font-bold text-slate-700" for="email">البريد الإلكتروني</label><input type="email" id="email" name="email" class="input-style" placeholder="example@email.com" required autocomplete="email"></div>
        <div><label class="block mb-1.5 font-bold text-slate-700" for="message">رسالتك</label><textarea id="message" name="message" rows="5" class="input-style" placeholder="اكتب رسالتك هنا" required></textarea></div>
        <button type="submit" class="primary-btn px-8 py-3 rounded-xl text-lg w-full sm:w-auto mx-auto"><i class="fas fa-paper-plane"></i> إرسال الرسالة</button>
      </form>
      <div id="successMsg" class="hidden text-center mt-5 font-bold" role="status"></div>
    </div>
    <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-5 text-center">
      <div class="bg-blue-50/70 rounded-2xl p-6"><i class="fas fa-envelope text-2xl text-blue-600 mb-2"></i><h3 class="font-bold mb-1">البريد</h3><p class="text-slate-500 select-all" dir="ltr">souqdotcom0@gmail.com</p></div>
      <div class="bg-blue-50/70 rounded-2xl p-6"><i class="fas fa-phone text-2xl text-blue-600 mb-2"></i><h3 class="font-bold mb-1">الهاتف</h3><p class="text-slate-500 select-all" dir="ltr">+218916773527</p></div>
      <div class="bg-blue-50/70 rounded-2xl p-6"><i class="fas fa-location-dot text-2xl text-blue-600 mb-2"></i><h3 class="font-bold mb-1">العنوان</h3><p class="text-slate-500">طرابلس، ليبيا</p></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
renderSharedShell("contact", {}); initAOS();
document.getElementById('contactForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const box = document.getElementById('successMsg');
  try {
    const res = await apiFetch("/api/contact", { method: "POST", body: JSON.stringify({ name: document.getElementById('name').value.trim(), email: document.getElementById('email').value.trim(), message: document.getElementById('message').value.trim() }) });
    box.textContent = (res.apiBody || {}).message || "تم إرسال رسالتك بنجاح!";
    box.className = "text-center mt-5 font-bold text-green-600";
    document.getElementById('contactForm').reset();
  } catch (err) {
    box.textContent = apiErrorMessage(err, "تعذر إرسال الرسالة.");
    box.className = "text-center mt-5 font-bold text-red-600";
  }
  box.classList.remove("hidden"); setTimeout(() => box.classList.add("hidden"), 6000);
});
</script>
</body>
</html>
