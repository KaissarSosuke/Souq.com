<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | سوق.كوم</title>
    <script src="common.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{head:['Cairo','Tajawal','sans-serif'],body:['Tajawal','Cairo','sans-serif']}}}};</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
        }
        .logo-gradient {
            background: linear-gradient(90deg,#2563eb 40%,#fbeed3 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            font-size: 2.4rem;
            letter-spacing: 0.07em;
        }
        .primary-btn {
            background: linear-gradient(90deg,#2563eb 70%, #fbeed3 100%);
            color: white;
            box-shadow: 0 2px 6px rgba(37,99,235,0.18);
            font-weight: 500;
            border: none;
            transition: background 0.2s;
        }
        .primary-btn:disabled {
            background: #a5b4fc;
            color: #fff;
            cursor: not-allowed;
        }
        .primary-btn:hover:not(:disabled) {
            background: linear-gradient(90deg,#1e40af 70%, #fbeed3 100%);
        }
        .input-style {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            padding: 0.75rem 1rem;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-style:focus {
            border-color: #2563eb;
            background: #fff;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }
        .success-msg {
            color: #16a34a;
            font-size: 1.1rem;
            margin-top: 1rem;
            text-align: center;
        }
        /* مودال الكود */
        .modal-bg {
            background: rgba(0,0,0,0.45);
        }
        .modal-sheet {
            background: #fff;
            border-radius: 1.2rem;
            max-width: 380px;
            width: 96%;
            margin: 0 auto;
            padding: 2.5rem 2rem 2rem 2rem;
            box-shadow: 0 4px 32px 0 #0002;
            position: relative;
            animation: fadeIn .23s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98);}
            to   { opacity: 1; transform: scale(1);}
        }
    </style>

  <meta name="description" content="سوق.كوم — متجر ليبي للشنط والإكسسوارات الأصلية.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="سوق.كوم">
  <meta property="og:description" content="شنط وإكسسوارات أصلية — توصيل لكل ليبيا.">
  <meta property="og:image" content="assets/og-cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="site.css">

</head>
<body class="rtl-support font-body">

    <!-- الهيدر -->
    <div id="site-header"></div>

    <!-- فورم تسجيل حساب جديد -->
    <main id="main" class="container px-4">
    <section class="flex items-center justify-center min-h-[70vh] py-8" data-aos="fade-up">
        <div class="bg-white/90 backdrop-blur rounded-3xl shadow-xl max-w-lg w-full px-6 md:px-8 py-10">
            <p class="text-blue-600 font-bold text-sm mb-1 text-center">انضم إلينا</p>
            <h1 class="font-head text-2xl md:text-3xl font-extrabold text-slate-900 mb-4 text-center">إنشاء حساب جديد</h1>
            <form id="signUpForm" class="space-y-6">
                <div>
                    <label for="fullName" class="block mb-2 font-medium text-gray-700">الاسم الكامل</label>
                    <input type="text" id="fullName" name="fullName" class="input-style w-full" placeholder="اكتب اسمك هنا" required>
                    <div class="error-msg" id="fullNameErr"></div>
                </div>
                <div>
                    <label for="email" class="block mb-2 font-medium text-gray-700">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" class="input-style w-full" placeholder="example@email.com" required>
                    <div class="error-msg" id="emailErr"></div>
                </div>
                <div>
                    <label for="password" class="block mb-2 font-medium text-gray-700">كلمة المرور</label>
                    <input type="password" id="password" name="password" class="input-style w-full" placeholder="أدخل كلمة المرور" minlength="8" required>
                    <div class="error-msg" id="passwordErr"></div>
                </div>
                <div>
                    <label for="confirmPassword" class="block mb-2 font-medium text-gray-700">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="input-style w-full" placeholder="أعد كتابة كلمة المرور" required>
                    <div class="error-msg" id="confirmPasswordErr"></div>
                </div>
                <button type="submit" id="signUpBtn" class="primary-btn px-8 py-3 rounded-lg text-lg w-full flex items-center justify-center gap-2" disabled>
                    <i class="fas fa-user-plus"></i>
                    إنشاء حساب
                </button>
                <div id="formSuccess" class="success-msg hidden">تم إرسال كود التحقق إلى بريدك. أدخل الكود في النافذة أدناه.</div>
                <div id="formError" class="error-msg text-center hidden"></div>
            </form>
            <div class="mt-8 text-center text-gray-700">
                <span>لديك حساب بالفعل؟</span>
                <a href="index.html" class="text-blue-600 hover:underline font-semibold">تسجيل الدخول</a>
            </div>
        </div>
    </section>
    </main>

    <!-- مودال إدخال كود التحقق -->
    <div id="verifyCodeModal" class="fixed inset-0 z-50 flex items-center justify-center modal-bg hidden">
        <div class="modal-sheet">
            <button onclick="closeCodeModal()" class="absolute left-4 top-4 text-gray-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold text-blue-700 mb-6 text-center">تحقق البريد الإلكتروني</h2>
            <form id="verifyCodeForm">
                <input type="text" id="inputVerCode" class="input-style w-full mb-2 text-center text-xl" maxlength="6" required placeholder="أدخل الكود المكون من 6 أرقام">
                <div class="error-msg" id="codeErr"></div>
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg w-full">تأكيد الكود</button>
                <div class="success-msg hidden" id="codeSuccess">تم تفعيل حسابك بنجاح!</div>
                <div class="text-sm text-gray-500 mt-2">لم يصلك الكود؟ <button type="button" id="resendBtn" class="text-blue-600 underline">إعادة الإرسال</button></div>
            </form>
        </div>
    </div>


    

    <!-- الفوتر -->
    <div id="site-footer"></div>

    <script>
        // تحقق من صحة كل حقل
        function validateForm() {
            let valid = true;
            // الاسم الكامل
            const fullName = document.getElementById('fullName').value.trim();
            if (fullName.length < 3) {
                document.getElementById('fullNameErr').textContent = "يرجى إدخال اسم كامل صحيح";
                valid = false;
            } else {
                document.getElementById('fullNameErr').textContent = "";
            }

            // البريد الإلكتروني
            const email = document.getElementById('email').value.trim();
            const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
            if (!emailPattern.test(email)) {
                document.getElementById('emailErr').textContent = "يرجى إدخال بريد إلكتروني صحيح";
                valid = false;
            } else {
                document.getElementById('emailErr').textContent = "";
            }

            // كلمة المرور
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                document.getElementById('passwordErr').textContent = "كلمة المرور يجب أن لا تقل عن 8 خانات";
                valid = false;
            } else if (!(/[A-Za-z]/.test(password) && /[0-9]/.test(password))) {
                document.getElementById('passwordErr').textContent = "كلمة المرور يجب أن تحتوي على أحرف وأرقام";
                valid = false;
            } else {
                document.getElementById('passwordErr').textContent = "";
            }

            // تأكيد كلمة المرور
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (confirmPassword !== password || confirmPassword.length === 0) {
                document.getElementById('confirmPasswordErr').textContent = "يرجى تأكيد كلمة المرور بشكل صحيح";
                valid = false;
            } else {
                document.getElementById('confirmPasswordErr').textContent = "";
            }

            // تفعيل/تعطيل زر التسجيل
            document.getElementById('signUpBtn').disabled = !valid;
            return valid;
        }

        // تحقق حي في كل تغيير
        document.querySelectorAll('#signUpForm input').forEach(input => {
            input.addEventListener('input', validateForm);
        });

        // حفظ بيانات التسجيل مؤقتاً
        let pendingSignUpData = null;
        let currentEmail = "";

        // إرسال البيانات للباك اند (طلب إنشاء وإرسال الكود)
        document.getElementById('signUpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!validateForm()) return;

            // اجمع البيانات
            const data = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            document.getElementById('formError').classList.add('hidden');
            document.getElementById('formSuccess').classList.add('hidden');
            document.getElementById('signUpBtn').disabled = true;

            try {
                const res = await apiFetch('/api/signup/send-code', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                pendingSignUpData = data;
                currentEmail = data.email;
                document.getElementById('formSuccess').classList.remove('hidden');
                setTimeout(() => {
                    openCodeModal();
                }, 900);
            } catch (err) {
                document.getElementById('formError').textContent = apiErrorMessage(err, "حدث خطأ أثناء إرسال الكود");
                document.getElementById('formError').classList.remove('hidden');
                document.getElementById('signUpBtn').disabled = false;
            }
        });

        // فتح مودال الكود
        function openCodeModal() {
            document.getElementById('verifyCodeModal').classList.remove('hidden');
            document.getElementById('inputVerCode').value = "";
            document.getElementById('codeErr').textContent = "";
            document.getElementById('codeSuccess').classList.add('hidden');
        }
        function closeCodeModal() {
            document.getElementById('verifyCodeModal').classList.add('hidden');
        }

        // تحقق كود التحقق
        document.getElementById('verifyCodeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('inputVerCode').value.trim();
            if (!code.match(/^[0-9]{6}$/)) {
                document.getElementById('codeErr').textContent = "يرجى إدخال الكود المكون من 6 أرقام";
                return;
            }
            document.getElementById('codeErr').textContent = "";
            document.getElementById('codeSuccess').classList.add('hidden');

            // إرسال الكود للباك اند للتحقق وإنشاء الحساب
            try {
                const res = await apiFetch('/api/signup/verify-code', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: currentEmail,
                        code: code
                    })
                });
                const result = res.apiBody || {};
                document.getElementById('codeSuccess').textContent = result.message || "تم تفعيل حسابك بنجاح!";
                document.getElementById('codeSuccess').classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2200);
            } catch (err) {
                document.getElementById('codeErr').textContent = apiErrorMessage(err, "كود غير صحيح أو منتهي");
            }
        });

        // زر إعادة إرسال الكود
        document.getElementById('resendBtn').onclick = async function() {
            if (!pendingSignUpData || !currentEmail) return;
            document.getElementById('resendBtn').disabled = true;
            try {
                await apiFetch('/api/signup/send-code', {
                    method: 'POST',
                    body: JSON.stringify(pendingSignUpData)
                });
                document.getElementById('codeErr').textContent = "تم إرسال الكود مرة أخرى لبريدك.";
            } catch (err) {
                document.getElementById('codeErr').textContent = apiErrorMessage(err, "تعذر إرسال الكود.");
            } finally {
                setTimeout(() => {
                    document.getElementById('resendBtn').disabled = false;
                }, 3000);
            }
        }
    </script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>renderSharedShell("signup", {"search": false}); initAOS();</script>
</body>
